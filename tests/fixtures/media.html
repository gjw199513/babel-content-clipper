<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>30 秒公开测试媒体</title>
<style>body{font:18px/1.7 system-ui;max-width:900px;margin:36px auto;padding:24px;background:#f7f9f7;color:#203336}video{display:block;width:640px;max-width:100%}audio{width:640px;max-width:100%}button{margin:8px;padding:8px}</style>
<h1>片段时间与现场录制</h1><p>由 FFmpeg 的测试信号生成，供本项目采集、跳转与声音轨验证。</p>
<video id="main-video" controls muted preload="auto" src="media/sample.webm"></video>
<button id="seek-back">回到 5 秒</button><button id="seek-forward">跳到 18 秒</button><button id="speed">切换两倍速</button>
<h2>独立音频元素</h2><audio id="audio" controls muted preload="metadata" src="media/sample.webm"></audio>
<script>
const video=document.querySelector('video');
document.querySelector('#seek-back').onclick=()=>video.currentTime=5;
document.querySelector('#seek-forward').onclick=()=>video.currentTime=18;
document.querySelector('#speed').onclick=()=>video.playbackRate=video.playbackRate===1?2:1;
</script></html>
